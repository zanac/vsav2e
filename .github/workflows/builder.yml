name: Windows builder

# Builds vsav2e-builder.exe: a window that makes vsav2e.zip from the user's own MAME sets, with the
# pictures it needs inside (assets/). On a tag (v*) the program is also attached to a draft release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install pillow pyinstaller
      - name: Check the sources compile
        run: python -m compileall -q tools text make_vsav2e.py
      - name: Build the program
        run: pyinstaller --noconfirm tools/builder/vsav2e_builder.spec
      - name: Checksum of the program
        shell: bash
        run: sha256sum dist/vsav2e-builder.exe | tee dist/vsav2e-builder.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vsav2e-builder
          path: |
            dist/vsav2e-builder.exe
            dist/vsav2e-builder.exe.sha256
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/vsav2e-builder.exe
            dist/vsav2e-builder.exe.sha256
